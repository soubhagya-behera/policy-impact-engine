# Policy Impact Engine — local deployment stack (Phase 13-E, see DECISIONS.md ADR-028).
#
# Usage (repository root):
#   cp .env.example .env   # then edit real secrets into .env (never commit it)
#   docker compose up -d --build
#   docker compose --profile ai up -d --build   # optional local-AI explanations
#
# Single backend replica only: rate limiting and the scheduler tick are
# per-instance. Do not scale past one replica without a new ADR.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: policypulse
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port published by default; the backend reaches the DB as db:5432.
    # Uncomment for local debugging with psql:
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d policypulse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/policypulse
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:?SECURITY_JWT_SECRET must be set in .env}
      # Optional overrides (defaults already safe; uncomment to change):
      # MONITORING_CHECK_INTERVAL: PT24H
      # RATE_LIMIT_ENABLED: "true"
      # APP_CORS_ALLOWED_ORIGINS: https://app.example.com
      # Local-AI explanations (needs the ai profile below): set
      # AI_ENABLED=true and AI_BASE_URL=http://ollama:11434 in .env.
      # With the defaults below the backend runs exactly as without AI.
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-http://localhost:11434}
      AI_MODEL: ${AI_MODEL:-llama3.1}
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  # Optional local-AI explanations (Phase 12 design, profile OFF by default).
  # Never mandatory: with the profile absent the backend runs exactly as
  # without AI and explanation requests resolve to deterministic fallback.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama-models:/root/.ollama
    # Uncomment for local debugging against the Ollama API:
    # ports:
    #   - "11434:11434"
    restart: unless-stopped

volumes:
  pgdata:
  ollama-models:
