# ===================================================================
# EXAMPLE configuration - GitHub-SAFE TEMPLATE
# This file is safe to commit and push. It is NOT loaded by Spring
# Boot automatically.
# Real credentials belong ONLY in the local application.properties
# file, which is Git-ignored and must never be pushed.
# Contains no real credentials, secrets, API keys, or JWT secrets.
# ===================================================================

spring.application.name=policy-impact-engine

# --- PostgreSQL datasource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/policypulse
spring.datasource.username=your_postgresql_username
spring.datasource.password=your_postgresql_password

# --- JPA / Hibernate ---
# "validate": Hibernate must never create or update the schema.
# Schema evolution is managed exclusively through Flyway migrations.
spring.jpa.hibernate.ddl-auto=validate

# --- Flyway ---
# Defaults are used: enabled, locations=classpath:db/migration.

# --- JWT access authentication (Phase 8B) ---
# Real secrets belong ONLY in the local application.properties file
# (Git-ignored) or the SECURITY_JWT_SECRET environment variable.
# The value below is a non-functional placeholder showing the shape:
# at least 32 UTF-8 bytes (256 bits for HS256). Blank, missing, or
# short secrets fail fast at startup.
# security.jwt.secret=change-me-to-a-256-bit-secret-that-is-never-committed
# How long issued access tokens stay valid (ISO-8601 Duration).
# security.jwt.access-token-ttl=PT15M

# --- Monitoring scheduler (Phase 2T) ---
# How often due policies are re-observed, and how far each policy's
# next_check_at advances after every completed check (ISO-8601 Duration).
monitoring.check-interval=PT24H

# --- Retry with bounded backoff (Phase 2U.1) ---
# Transient failures retry until this many total attempts per chain
# (1 initial attempt + retries), waiting base-delay growing
# exponentially by multiplier per attempt, capped at max-delay, with
# equal jitter. Permanent failures and exhausted chains fall back to
# monitoring.check-interval.
monitoring.retry-max-attempts=5
monitoring.retry-base-delay=PT5M
monitoring.retry-multiplier=2.0
monitoring.retry-max-delay=PT6H

# --- Stale IN_PROGRESS recovery (Phase 2U.2) ---
# An IN_PROGRESS attempt whose started_at is at or past stale-timeout is
# presumed orphaned (crashed worker) and recovered to FAILED/TRANSIENT,
# rescheduled through the retry policy above. The sweeper runs every
# stale-check-interval and reaps at most stale-batch-size rows per run,
# oldest first. stale-timeout must stay far above any legitimate
# observation latency and well below monitoring.check-interval.
monitoring.stale-timeout=PT30M
monitoring.stale-check-interval=PT5M
monitoring.stale-batch-size=100

# --- Optional local AI explanations (Phase 12, ADR-024) ---
# Disabled by default: the application behaves exactly as without AI
# and makes zero model calls. Enable only with a local Ollama runtime;
# no cloud provider is supported. Model, URL, timeouts, and budgets are
# environmental, never hard-coded. Malformed values fail fast at startup,
# but only when ai.enabled=true.
# ai.enabled=false
# ai.provider=ollama
# ai.base-url=http://localhost:11434
# ai.model=llama3.1
# ai.connect-timeout=PT2S
# ai.request-timeout=PT30S
# ai.max-input-chars=4000
# ai.max-output-tokens=300

# --- Application rate limiting (Phase 13-C, ADR-025) ---
# In-process token buckets enforced by RateLimitFilter (after JWT
# authentication): auth endpoints per client IP, explanation and
# general API per authenticated user, everything else per client IP
# when anonymous. Over-limit callers receive 429
# application/problem+json with Retry-After. `enabled=false` is a true
# pass-through (incident kill-switch). No Redis or external state.
# Defaults below are the ADR-025 contract; uncomment to override.
# rate-limit.enabled=true
# rate-limit.auth-window=PT1M
# rate-limit.auth-max-requests=10
# rate-limit.api-window=PT1M
# rate-limit.api-max-requests=600
# rate-limit.explanation-window=PT1M
# rate-limit.explanation-max-requests=10
# rate-limit.anonymous-window=PT1M
# rate-limit.anonymous-max-requests=60
# rate-limit.max-tracked-keys=100000
# rate-limit.idle-ttl=PT10M

# --- Minimal observability baseline (Phase 13-D, ADR-027) ---
# Only health + info are exposed under /actuator on the same
# application port. Health details are never shown (the body is
# {"status":"UP"} only). Both endpoints stay authenticated.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- Deny-by-default CORS for /api/** (Phase 13-D, ADR-027) ---
# Empty allowed-origins (the default) registers no CORS mappings,
# so cross-origin browser calls are blocked. To opt in, uncomment
# and list exact http(s)://host[:port] origins (no wildcards, no
# paths). Methods/headers stay within the locked subsets;
# allow-credentials stays false; CORS never applies to /actuator/**.
# app.cors.allowed-origins=https://app.example.com
# app.cors.allowed-methods=GET,POST,PUT
# app.cors.allowed-headers=Authorization,Content-Type
# app.cors.allow-credentials=false
# app.cors.max-age=PT1H

# --- Containerized deployment (Phase 13-E, ADR-028) ---
# When running under docker compose, these properties come from the
# environment (root .env, Git-ignored) instead of this file:
# SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/policypulse
# SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# SECURITY_JWT_SECRET (required, >= 32 bytes, fail-fast)
# APP_CORS_ALLOWED_ORIGINS (comma-separated exact origins; empty = closed)
# AI_ENABLED=false (default) / AI_BASE_URL / AI_MODEL (ai profile only)
# Server port stays 8080; Actuator stays health+info, authenticated.

