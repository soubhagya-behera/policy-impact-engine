# ===================================================================
# EXAMPLE configuration - GitHub-SAFE TEMPLATE
# This file is safe to commit and push. It is NOT loaded by Spring
# Boot automatically.
# Real credentials belong ONLY in the local application.properties
# file, which is Git-ignored and must never be pushed.
# Contains no real credentials, secrets, API keys, or JWT secrets.
# ===================================================================

spring.application.name=policy-impact-engine

# --- PostgreSQL datasource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/policypulse
spring.datasource.username=your_postgresql_username
spring.datasource.password=your_postgresql_password

# --- JPA / Hibernate ---
# Keep "none" until entities/schema exist
spring.jpa.hibernate.ddl-auto=none

