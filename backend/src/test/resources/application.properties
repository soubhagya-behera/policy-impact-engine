# ===================================================================
# TEST ONLY - automated-test secret, never production.
# This committed test secret lets full-context tests boot the JWT
# beans without any environment secret. It must never be used outside
# automated tests. Production secrets belong ONLY in the local
# (Git-ignored) application.properties or environment variables.
# ===================================================================

security.jwt.secret=test-only-secret-for-automated-tests-not-production-000000

# Phase 13-C — the shared in-process limiter is off for the general
# suite so unrelated tests never contend for budgets. The dedicated
# rate-limit integration tests re-enable it explicitly with shrunken
# budgets via @SpringBootTest properties.
rate-limit.enabled=false
